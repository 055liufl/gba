[workspace]
members = ["crates/*", "apps/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["Tyr Chen <tyr.chen@gmail.com>"]
edition = "2024"
license = "MIT"
documentation = "https://docs.rs/"
repository = "https://github.com/tyrchen/gba"
homepage = "https://github.com/tyrchen/gba"
readme = "README.md"

[workspace.dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
claude-agent-sdk-rs = "0.6.4"
crossterm = "0.29.0"
futures = "0.3"
minijinja = { version = "2.19.0", features = ["loader"] }
ratatui = "0.30.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.142"
serde_yml = "0.0.12"
tempfile = "3"
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["rt", "rt-multi-thread", "macros", "fs", "process"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
typed-builder = "0.23.2"

# workspace crates
gba-core = { path = "crates/gba-core" }
gba-pm = { path = "crates/gba-pm" }
